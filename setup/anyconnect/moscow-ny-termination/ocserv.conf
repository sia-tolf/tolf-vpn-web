auth = "certificate"
ca-cert = /etc/ocserv-moscow/tolf-client-ca.pem
config-per-user = /etc/ocserv-moscow/config-per-user/
connect-script = /usr/bin/tolf-oc-device-hook
disconnect-script = /usr/bin/tolf-oc-device-hook
crl = /etc/ocserv-moscow/uk-client-ca.crl.pem
cert-user-oid = 2.5.4.3
cookie-timeout = 28800
deny-roaming = false

listen-host = 92.243.66.204
tcp-port = 4443
udp-port = 4443

server-cert = /etc/ocserv-ny-moscow/fullchain.pem
server-key = /etc/ocserv-ny-moscow/privkey.pem

max-clients = 8
max-same-clients = 2

keepalive = 20
dpd = 60
mobile-dpd = 30
switch-to-tcp-timeout = 8
try-mtu-discovery = false

tls-priorities = "NORMAL:-CIPHER-ALL:+AES-128-GCM:+CHACHA20-POLY1305:%SERVER_PRECEDENCE:%COMPAT:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1:-VERS-TLS1.3"

device = vpns-mowN
predictable-ips = true

ipv4-network = 10.24.0.0
ipv4-netmask = 255.255.255.0

dns = 10.254.0.54
tunnel-all-dns = true

cisco-client-compat = true
dtls-legacy = true

use-occtl = true
occtl-socket-file = /var/run/occtl-ny-moscow.socket
socket-file = /var/run/ocserv-ny-moscow-socket
pid-file = /var/run/ocserv-ny-moscow.pid

run-as-user = ocserv
run-as-group = ocserv

# TOLF routing modes selected by URL

# TOLF routing mode selector

# Cisco Secure Client profile
user-profile = /etc/ocserv-moscow/tolf-moscow.xml

# TOLF routing mode selector

# BEGIN TOLF DIRECT MEASUREMENT BYPASS 20261019
no-route = 188.214.39.114/32
no-route = 92.243.66.32/32
no-route = 162.252.174.201/32
append-global-routes = true
# END TOLF DIRECT MEASUREMENT BYPASS 20261019
route = default
no-route = 92.243.66.204/32
mtu = 1380
