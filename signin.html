<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>TOLF Sign in</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #f5f5f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    main {
      width: min(460px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .brand {
      display: inline-block;
      color: inherit;
      text-decoration: none;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.5px;
      margin-bottom: 48px;
    }

    .card {
      background: #fff;
      border: 1px solid #e3e3e7;
      border-radius: 18px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -.6px;
    }

    p {
      margin: 0 0 22px;
      color: #6e6e73;
      line-height: 1.45;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      padding: 9px 18px;
      background: #1d1d1f;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    #message {
      margin-top: 16px;
      line-height: 1.4;
    }

    .error {
      color: #b42318;
    }
  </style>
</head>

<body>
  <main>
    <a class="brand" href="https://tolf.is/">TOLF</a>

    <section class="card">
      <h1>Sign in</h1>
      <p>Sign in to your TOLF account with your Passkey.</p>

      <button id="signInButton" type="button">
        Sign in with Passkey
      </button>

      <div id="message"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/webauthn.js"></script>

  <script>
    const RETURN_URL = "https://smartdns.tolf.is/";

    const signInButton =
      document.getElementById("signInButton");

    const message =
      document.getElementById("message");

    function goBack() {
      window.location.replace(RETURN_URL);
    }

    async function alreadySignedIn() {
      try {
        await apiRequest("/me", { method: "GET" });
        goBack();
        return true;
      } catch {
        return false;
      }
    }

    signInButton.addEventListener("click", async () => {
      signInButton.disabled = true;
      message.className = "";
      message.textContent = "Waiting for Passkey…";

      try {
        const begin = await apiRequest(
          "/passkey/login/begin",
          {
            method: "POST",
            body: "{}"
          }
        );

        const credential =
          await navigator.credentials.get({
            publicKey:
              prepareAuthenticationOptions(begin.options)
          });

        if (!credential) {
          throw new Error("Passkey was not provided");
        }

        await apiRequest(
          "/passkey/login/finish",
          {
            method: "POST",
            body: JSON.stringify({
              challengeId: begin.challengeId,
              credential:
                serializeCredential(credential)
            })
          }
        );

        goBack();
      } catch (error) {
        message.className = "error";
        message.textContent =
          error.message || "Sign in failed";
        signInButton.disabled = false;
      }
    });

    alreadySignedIn();
  </script>
</body>
</html>
