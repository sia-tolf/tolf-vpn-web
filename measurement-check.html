<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TOLF — проверка замера</title><style>body{font:16px system-ui;max-width:800px;margin:30px auto;padding:16px}button,select{font:inherit;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Проверка замера</h1><p>Тест соединения с Нью-Йорком. Диагностика отображается только на этой странице.</p><select id="order"><option value="P_D_U">Задержка, загрузка и отдача</option value="U">Только отдача</option></select> <button id="run">Начать</button><pre id="result">Готово к проверке</pre><script src="js/librespeed.js?v=1"></script><script>
let test; const out=document.getElementById('result'),button=document.getElementById('run');
window.addEventListener('error',e=>{out.textContent+='\nJS: '+e.message;button.disabled=false});
button.onclick=()=>{button.disabled=true;out.textContent='Запуск';test=new Speedtest();
for(const [key,value] of Object.entries({test_order:document.getElementById('order').value,count_ping:10,time_dl_max:15,time_ul_max:15,time_auto:false,time_ulGraceTime:0,xhr_dlMultistream:8,xhr_ulMultistream:4,xhr_ul_blob_megabytes:4,telemetry_level:0,overheadCompensationFactor:1,xhr_ignoreErrors:0,forceIE11Workaround:true}))test.setParameter(key,value);
test.setSelectedServer({name:'New York',server:'https://ikev2-us.tolf.is:8443/',dlURL:'garbage.php',ulURL:'empty.php',pingURL:'empty.php',getIpURL:'getIP.php'});
test.onupdate=data=>{out.textContent=JSON.stringify(data,null,2)};
test.onend=aborted=>{out.textContent+='\n'+(aborted?'Прерван':'Завершён');button.disabled=false;test.worker.terminate()};
test.start();test.worker.addEventListener('error',e=>{out.textContent+='\nWORKER: '+e.message+' line '+e.lineno;button.disabled=false;test.abort()});
};</script></html>
