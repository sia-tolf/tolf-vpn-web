<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>TOLF VPN · Quick setup</title>
<link rel="stylesheet" href="quick-1.css"><script defer src="../js/webauthn.js"></script><script defer src="strings-1.js"></script><script defer src="quick-1.js"></script></head>
<body><main><header><a href="/">TOLF VPN</a><nav aria-label="Language"><button data-lang="en">English</button><button data-lang="ru">Русский</button><button data-lang="lv">Latviešu</button></nav></header>
<section class="card"><p class="eyebrow" data-text="eyebrow"></p><h1 data-text="title"></h1><p id="intro" data-text="intro"></p>
<div id="selection"><div class="summary"><div><span data-text="device"></span><strong id="deviceSummary"></strong></div><div><span data-text="recommended"></span><strong id="serverSummary"></strong></div><button id="change" class="text" data-text="change"></button></div>
<div id="choices" hidden><label for="platform" data-text="device"></label><select id="platform"><option value="ios">iPhone / iPad</option><option value="android">Android</option><option value="windows">Windows</option></select><label for="server" data-text="node"></label><select id="server"><option value="riga" data-text="riga"></option><option value="moscow" data-text="moscow"></option></select><p class="note" data-text="geo"></p></div></div>
<div id="auth" hidden><button id="register" class="primary" data-text="create"></button><button id="login" data-text="login"></button><p class="note" data-text="passkey"></p></div>
<div id="recovery" hidden><h2 data-text="recoveryTitle"></h2><p data-text="recoveryHelp"></p><input id="code" readonly autocomplete="off" aria-label="Recovery Code"><button id="copyCode" data-text="copy"></button><button id="saved" class="primary" data-text="saved"></button></div>
<div id="preparePanel" hidden><button id="prepare" class="primary" data-text="prepare"></button><p class="note" data-text="defaults"></p></div>
<div id="delivery" hidden><h2 data-text="ready"></h2><p id="deliveryHelp"></p><a id="download" class="button primary" rel="noreferrer"></a><div id="android" hidden><a href="https://play.google.com/store/apps/details?id=org.strongswan.android" target="_blank" rel="noopener noreferrer" data-text="androidApp"></a></div><div id="sharing" hidden><label for="profileLink" data-text="personal"></label><div class="copyrow"><input id="profileLink" readonly><button id="copyLink" data-text="copy"></button></div><button id="share" data-text="share"></button></div><p class="note" id="downloadHelp"></p></div>
<p id="message" role="status" aria-live="polite"></p><button id="retry" hidden data-text="retry"></button><a class="back" href="/" data-text="advanced"></a></section></main></body></html>
