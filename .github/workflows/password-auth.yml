name: Password account checks
on:
  push:
    branches: ['codex/password-auth', 'main']
    paths: ['auth/**', 'account/**', 'js/**', 'css/**', 'setup/password-auth/**', 'tests/password-auth/**', 'js/account.js', 'js/account-password.js', 'css/account-password.css', 'index.html', 'js/recovery.js', 'quick/**', '.github/workflows/password-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi httpx
      - run: python tests/password-auth/test_password_auth.py
      - run: |
          python setup/password-auth/build.py
          git diff --exit-code setup/password-auth/install-password-auth.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/password-auth/browser.cjs
      - run: node tests/password-auth/account-browser.cjs
      - run: node tests/password-auth/account-page.cjs
      - run: node tests/quick/state.cjs
      - run: node tests/quick/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-auth-preview
          path: |
            /tmp/tolf-password*.png
            /tmp/tolf-passkey*.png
