name: Routing installer checks
on:
  push:
    branches: ['main']
    paths: ['setup/routing/**', 'tests/routing/**', '.github/workflows/routing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/routing -v
      - run: python -m py_compile setup/routing/install-sryt-routing.py
