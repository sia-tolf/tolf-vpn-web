name: Routing installer checks
on:
  push:
    branches: ['main']
    paths: ['setup/routing/**', 'setup/personal-routing/**', 'tests/routing/**', 'js/**', 'index.html', '.github/workflows/routing.yml']
  pull_request:
    paths: ['setup/routing/**', 'setup/personal-routing/**', 'tests/routing/**', 'js/**', 'index.html', '.github/workflows/routing.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx
      - run: python -m unittest discover -s tests/routing -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/routing/test-personal-routing.cjs tests/routing/test-routing-policy.cjs tests/routing/test-entry-recommendation.cjs tests/routing/test-account-loading.cjs
      - run: python -m py_compile setup/routing/install-yt-routing.py
