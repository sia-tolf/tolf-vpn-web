name: TOLF iOS shortcut signing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shortcuts/build.py'
      - '.github/workflows/tolf-shortcuts.yml'
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate unsigned shortcuts
        run: python3 shortcuts/build.py
      - name: Sign with Apple Shortcuts
        shell: bash
        run: |
          set -euo pipefail
          command -v shortcuts
          mkdir -p shortcuts/signed
          shortcuts sign --mode anyone --input "shortcuts/unsigned/TOLF ON.shortcut" --output "shortcuts/signed/TOLF ON.shortcut"
          shortcuts sign --mode anyone --input "shortcuts/unsigned/TOLF OFF.shortcut" --output "shortcuts/signed/TOLF OFF.shortcut"
          file shortcuts/signed/*.shortcut
          test -s "shortcuts/signed/TOLF ON.shortcut"
          test -s "shortcuts/signed/TOLF OFF.shortcut"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tolf-shortcuts-signed
          path: shortcuts/signed/*.shortcut
