name: Windows ProfileXML crypto readback
on:
  push:
    branches: ['codex/windows-profilexml-schema-20261008']
    paths: ['tests/windows/crypto-ci.ps1', 'tests/windows/package-admin-ci.ps1', 'tests/windows/build-crypto-ci-package.py', '.github/workflows/windows-crypto-ci.yml', 'setup/windows/ppkg/personalize.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        pfs: ['omit', 'None', 'PFS2048']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y wimtools
      - run: python -m pip install cryptography
      - run: python tests/windows/build-crypto-ci-package.py ci-crypto-input wimlib-imagex "${{ matrix.pfs }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-crypto-input-${{ matrix.pfs }}
          path: ci-crypto-input
          retention-days: 3
  readback:
    strategy:
      fail-fast: false
      matrix:
        pfs: ['omit', 'None', 'PFS2048']
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-crypto-input-${{ matrix.pfs }}
          path: ci-crypto-input
      - name: Compare native provider, CSP and PPKG crypto readback
        shell: powershell
        run: |
          ./tests/windows/crypto-ci.ps1 -InputDirectory "$env:GITHUB_WORKSPACE/ci-crypto-input" -OutputDirectory "$env:GITHUB_WORKSPACE/ci-crypto-results"
      - name: Compare PPKG installation under the elevated runner account
        if: always()
        shell: powershell
        run: |
          ./tests/windows/package-admin-ci.ps1 -InputDirectory "$env:GITHUB_WORKSPACE/ci-crypto-input" -OutputDirectory "$env:GITHUB_WORKSPACE/ci-crypto-results/admin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-11-crypto-results-${{ matrix.pfs }}
          path: ci-crypto-results
          retention-days: 7
