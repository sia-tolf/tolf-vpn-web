name: VPN traffic ledger checks
on:
  push:
    paths:
      - 'setup/traffic/**'
      - 'tests/traffic/**'
      - '.github/workflows/traffic-checks.yml'
  pull_request:
    paths:
      - 'setup/traffic/**'
      - 'tests/traffic/**'
      - '.github/workflows/traffic-checks.yml'
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 setup/traffic/build.py
      - run: git diff --exit-code -- setup/traffic/install-moscow-receiver.py
      - run: python3 -m unittest discover -s tests/traffic -v
