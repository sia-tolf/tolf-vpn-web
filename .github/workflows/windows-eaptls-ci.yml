name: Windows certificate-only EAP-TLS readback
on:
  push:
    branches: ['codex/windows-profilexml-schema-20261008']
    paths: ['tests/windows/build-eaptls-ci-package.py', 'tests/windows/eaptls-ci.ps1', 'tests/windows/build-certstore-ci-packages.py', 'tests/windows/certstore-ci.ps1', '.github/workflows/windows-eaptls-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y wimtools
      - run: python -m pip install cryptography
      - run: python tests/windows/build-certstore-ci-packages.py ci-eaptls-input wimlib-imagex
      - uses: actions/upload-artifact@v4
        with:
          name: ci-eaptls-input
          path: ci-eaptls-input
          retention-days: 3
  readback:
    needs: package
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-eaptls-input
          path: ci-eaptls-input
      - name: Check distinct filters through native provider and PPKG
        shell: powershell
        run: ./tests/windows/eaptls-ci.ps1 -InputDirectory "$env:GITHUB_WORKSPACE/ci-eaptls-input" -OutputDirectory "$env:GITHUB_WORKSPACE/ci-eaptls-results"
      - name: Verify native PPKG certificate store scope
        if: always()
        shell: powershell
        run: ./tests/windows/certstore-ci.ps1 -InputDirectory "$env:GITHUB_WORKSPACE/ci-eaptls-input" -OutputDirectory "$env:GITHUB_WORKSPACE/ci-eaptls-results/certstore"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-eaptls-results
          path: ci-eaptls-results
          retention-days: 7
