name: TOLF UI one-time patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run TOLF UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current UI references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('  <script defer src="js/config.js?v=windows-1"></script>', '  <script defer src="passkey-session-label.20260917-1.js"></script>\n  <script defer src="js/config.js?v=windows-1"></script>', 1)
          s = s.replace('js/account.js?v=windows-link-field-20260914', 'js/account.js?v=passkey-label-20260917-1', 1)
          s = s.replace('tolf-buttons.20260917-2.css', 'tolf-buttons.20260917-3.css', 1)
          s = s.replace('tolf-wordmark.20260917-2.js', 'tolf-wordmark.20260917-3.js', 1)
          p.write_text(s)
          PY
          git config user.name sia-tolf
          git config user.email tolf@velbnk.is
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Load Passkey label helper and latest TOLF UI on VPN page"
            git push
          fi
