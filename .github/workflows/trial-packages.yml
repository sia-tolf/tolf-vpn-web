name: Trial packages
on:
  push:
    paths: ['setup/trials/**', 'setup/admin/tolf_account_admin.py', 'setup/payments/tolf_billing_live.py', 'tests/trials/**', 'billing/trial-registration.js', '.github/workflows/trial-packages.yml']
  pull_request:
    paths: ['setup/trials/**', 'setup/admin/tolf_account_admin.py', 'setup/payments/tolf_billing_live.py', 'tests/trials/**', 'billing/trial-registration.js', '.github/workflows/trial-packages.yml']
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install fastapi
      - run: python -m unittest discover -s tests/trials -v
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/trials/frontend.cjs
