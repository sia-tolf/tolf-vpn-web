name: TOLF Cherri shortcut syntax
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shortcuts/cherri-*.cherri'
      - 'shortcuts/verify-cherri-source.cjs'
      - '.github/workflows/tolf-cherri-compile.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node shortcuts/verify-cherri-source.cjs
      - name: Fetch Cherri v2.3.0 Linux binary
        run: |
          set -e
          curl -fsSL --retry 2 --max-time 30 -o /tmp/cherri.zip \
            https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip
          mkdir -p /tmp/cherri
          unzip -q /tmp/cherri.zip -d /tmp/cherri
          find /tmp/cherri -maxdepth 2 -type f -printf '%p\n'
          chmod +x /tmp/cherri/cherri
          /tmp/cherri/cherri --help | head -35
      - name: Compile both workflows (syntax and plist)
        run: |
          set -e
          for name in on off; do
            /tmp/cherri/cherri "shortcuts/cherri-$name.cherri" --debug
          done
      - name: Verify two signed VPN actions and prepare experimental downloads
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, shutil
          out=pathlib.Path('shortcuts/signed')
          out.mkdir(parents=True,exist_ok=True)
          for name,ops,on in [
              ('TOLF ON',['Set On Demand','Connect'],True),
              ('TOLF OFF',['Set On Demand','Disconnect'],False),
          ]:
              source=pathlib.Path('shortcuts')/(name+'.shortcut')
              info=pathlib.Path('shortcuts')/(name+'.plist')
              data=source.read_bytes()
              assert data[:4]==b'AEA1' and len(data)>2000, name+' was not signed'
              p=plistlib.loads(info.read_bytes())
              acts=p['WFWorkflowActions']
              assert len(acts)==2
              assert all(a['WFWorkflowActionIdentifier']=='is.workflow.actions.vpn.set' for a in acts)
              assert [a['WFWorkflowActionParameters']['WFVPNOperation'] for a in acts]==ops
              assert acts[0]['WFWorkflowActionParameters']['WFOnDemandValue'] is on
              assert len(p['WFWorkflowImportQuestions'])==2
              assert {q['ParameterKey'] for q in p['WFWorkflowImportQuestions']}=={'WFVPN'}
              assert {q.get('ActionIndex',0) for q in p['WFWorkflowImportQuestions']}=={0,1}
              assert all(q['DefaultValue']=='TOLF Москва iPhone' for q in p['WFWorkflowImportQuestions'])
              dest=out/(name.replace(' ','-')+'.shortcut')
              shutil.copyfile(source,dest)
              print('SIGNED_PILOT_READY',name,len(data))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolf-cherri-compile-debug
          path: |
            shortcuts/*.plist
            shortcuts/*.shortcut
