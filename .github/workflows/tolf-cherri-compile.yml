name: TOLF native shortcut validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shortcuts/build.py'
      - 'shortcuts/test-native.py'
      - 'shortcuts/sign-native.py'
      - '.github/workflows/tolf-cherri-compile.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 shortcuts/test-native.py
      - run: python3 -m py_compile shortcuts/build.py shortcuts/sign-native.py
