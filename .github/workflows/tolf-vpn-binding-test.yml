name: TOLF iOS VPN picker binding test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'shortcuts/cherri-vpn-binding.cherri'
      - 'shortcuts/sign-vpn-binding.py'
      - '.github/workflows/tolf-vpn-binding-test.yml'
permissions:
  contents: write
jobs:
  compile-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Cherri v2.3.0 Linux
        run: |
          set -e
          curl -fsSL --retry 2 --max-time 30 -o /tmp/tolf-cherri.zip https://github.com/electrikmilk/cherri/releases/download/v2.3.0/cherri_linux-x86_64.zip
          mkdir -p /tmp/tolf-cherri
          unzip -q /tmp/tolf-cherri.zip -d /tmp/tolf-cherri
          chmod +x /tmp/tolf-cherri/cherri
      - name: Compile draft without signing
        run: /tmp/tolf-cherri/cherri shortcuts/cherri-vpn-binding.cherri --debug --skip-sign
      - name: Encode Apple VPNConfiguration and sign verified plist
        run: python3 shortcuts/sign-vpn-binding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolf-vpn-binding-test
          path: |
            shortcuts/TOLF VPN Binding Test.plist
            shortcuts/probe/TOLF-VPN-Binding-Test.shortcut
      - name: Publish verified diagnostic only
        run: |
          set -e
          git config user.name "TOLF Shortcuts CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f shortcuts/probe/TOLF-VPN-Binding-Test.shortcut
          git commit -m "Publish verified single-action VPN binding test"
          git push origin HEAD:main
