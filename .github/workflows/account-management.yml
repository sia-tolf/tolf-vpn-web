name: Account management checks
on:
  push:
    branches: ['main']
    paths: ['setup/admin/tolf_account_admin.py', 'setup/admin/account_management_patch.py', 'setup/admin/tolf_admin.py', 'setup/password-auth/tolf_password_auth.py', 'tests/account-management/**', 'admin/admin-1.3.js', 'billing/trial-registration.js', 'auth/auth.js', '.github/workflows/account-management.yml']
  pull_request:
    paths: ['setup/admin/tolf_account_admin.py', 'setup/admin/account_management_patch.py', 'setup/admin/tolf_admin.py', 'setup/password-auth/tolf_password_auth.py', 'tests/account-management/**', 'admin/admin-1.3.js', 'billing/trial-registration.js', 'auth/auth.js', '.github/workflows/account-management.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi
      - run: python -m unittest discover -s tests/account-management -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/account-management/frontend.cjs
      - run: node --check admin/admin-1.3.js && node --check auth/auth.js && node --check billing/trial-registration.js && node --check admin/visits.js
