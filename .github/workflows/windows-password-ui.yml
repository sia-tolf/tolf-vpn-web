name: Windows password browser checks
on:
  push:
    branches: ['codex/windows-control-*']
    paths: ['js/windows.js', 'js/locales/**', 'css/styles.css', 'tests/windows-password-ui.cjs', '.github/workflows/windows-password-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/windows-password-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-password-browser
          path: /tmp/tolf-password-web.png
