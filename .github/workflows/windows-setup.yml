name: Windows setup build
on:
  push:
    branches: [main]
    paths: ['setup/windows/**', '.github/workflows/windows-setup.yml', 'tests/windows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx pytest
      - run: python -m pytest tests/windows -q
  build:
    needs: api-tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GUI installer
        shell: powershell
        run: ./setup/windows/build-desktop.ps1
      - name: Test native Windows VPN configuration
        shell: powershell
        run: |
          & ./setup/windows/dist/native-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native integration tests failed' }
      - name: Build London updater
        run: python setup/windows/build-update.py
      - name: Publish unsigned test build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "windows-setup-$env:GITHUB_SHA"
          gh release create $tag setup/windows/dist/TOLF-Setup.exe setup/windows/dist/update-windows-gui.py setup/windows/dist/SHA256SUMS --prerelease --target $env:GITHUB_SHA --title "TOLF Windows setup 2.0 native test build" --notes "Native C++ installer using built-in Windows APIs. No .NET, PowerShell or external Visual C++ runtime needed. Unsigned test build; real Windows VPN connection testing remains required."
