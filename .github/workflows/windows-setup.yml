name: Windows setup build
on:
  push:
    branches: [main, 'codex/windows-control-*']
    paths: ['setup/windows/**', '.github/workflows/windows-setup.yml', 'tests/windows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi httpx pytest
      - run: python -m pytest tests/windows -q
  build:
    needs: api-tests
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GUI installer
        shell: powershell
        run: ./setup/windows/build-desktop.ps1
      - name: Test native Windows VPN configuration
        shell: powershell
        run: |
          ./tests/windows/native-policy.ps1
          & ./setup/windows/dist/native-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native integration tests failed' }
      - name: Check native settings and widget windows
        shell: powershell
        run: ./tests/windows/ui-smoke.ps1
      - name: Diagnose native provider schema on failure
        if: failure()
        shell: powershell
        run: |
          Get-ChildItem "$env:WINDIR/System32/WindowsPowerShell/v1.0/Modules/VpnClient/*IPsec*.cdxml" | ForEach-Object { Get-Content $_.FullName }
          $c = Get-CimClass -Namespace 'root/Microsoft/Windows/RemoteAccess/Client' -ClassName PS_VpnConnectionIPsecConfiguration
          $c.CimClassMethods['SetByCustomPolicy'].Parameters | Format-List *
          Get-ChildItem "$env:WINDIR/System32/WindowsPowerShell/v1.0/Modules/VpnClient/*Route*.cdxml" | ForEach-Object { Get-Content $_.FullName }
          foreach ($class in @('PS_VpnConnectionRoute','PS_VpnConnection')) {
            $c = Get-CimClass -Namespace 'root/Microsoft/Windows/RemoteAccess/Client' -ClassName $class
            foreach ($method in @('Add','Remove','Set')) {
              Write-Output "$class.$method"
              $c.CimClassMethods[$method].Parameters | Format-List *
            }
          }
      - name: Build London updater
        run: python setup/windows/build-update.py
      - name: Publish unsigned test build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "windows-setup-$env:GITHUB_SHA"
          gh release create $tag setup/windows/dist/TOLF-Setup.exe setup/windows/dist/update-windows-gui.py setup/windows/dist/SHA256SUMS setup/windows/dist/settings-preview.png setup/windows/dist/widget-preview.png setup/windows/dist/password-preview.png --prerelease --target $env:GITHUB_SHA --title "TOLF Windows setup 2.6.0 native test build" --notes "Native C++ installer using built-in Windows APIs. No .NET, PowerShell or external Visual C++ runtime needed. Unsigned test build; real Windows VPN connection testing remains required."

