<!doctype html>
<html lang="en" data-tolf-ui="admin">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="same-origin">
<title>TOLF — Administration</title>
<link rel="stylesheet" href="/css/styles.css?v=windows-link-spacing-20260914">
<link rel="stylesheet" href="/admin/admin-1.3.css?v=cpu-history-20260925">
<script defer src="/admin/admin-1.3.js?v=cpu-history-20260925"></script>
<link rel="stylesheet" href="../tolf-buttons.20260917-3.css">
<script defer src="../tolf-wordmark.20260917-3.js"></script>

</head>
<body>
<main class="admin-shell">
<header class="admin-header"><div><a href="/" data-text="back">Back to My VPN</a><h1 data-text="title">Administration</h1><p data-text="subtitle">TOLF Network Suite</p></div><div class="tolf-language admin-languages" aria-label="Language"><button type="button" data-lang="en" lang="en" aria-label="English">EN</button><button type="button" data-lang="ru" lang="ru" aria-label="Русский">RU</button><button type="button" data-lang="lv" lang="lv" aria-label="Latviešu">LV</button></div></header>
<section id="gate" class="card admin-card" role="status"><p id="gateMessage"></p><a href="/" class="button-link primary" data-text="signIn">Sign in with Passkey</a></section>
<section id="workspace" hidden>
<div class="admin-toolbar"><nav class="admin-tabs" aria-label="Sections"><button id="sessionsTab" type="button" data-tab="sessions" data-text="sessions" hidden>VPN sessions</button><button type="button" data-tab="users" data-text="users">Accounts</button><button type="button" data-tab="registry" data-text="registry">VPN registry</button><button type="button" data-tab="audit" data-text="audit">Activity log</button></nav><button id="refresh" type="button" class="secondary" data-text="refresh">Refresh</button></div>
<p id="inventoryNote" class="admin-note" data-text="inventoryNote">Account records only. Live VPN sessions are not connected to this view yet.</p>
<form id="searchForm" class="admin-search"><label for="search" data-text="searchLabel">Account number, VPN username or device</label><div><input id="search" type="search" maxlength="128" autocomplete="off"><button type="submit" class="secondary" data-text="search">Search</button></div></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="results"></div>
<div id="pagination" class="admin-pagination"><button type="button" id="previous" class="secondary" data-text="previous">Previous</button><span id="pageLabel"></span><button type="button" id="next" class="secondary" data-text="next">Next</button></div>
<section id="detail" class="card admin-card" hidden aria-labelledby="detailTitle"><div class="admin-detail-heading"><h2 id="detailTitle"></h2><button id="closeDetail" type="button" class="secondary" data-text="close">Close</button></div><div id="detailContent"></div></section>
</section>
<footer>TOLF · Admin 1.3</footer>
</main>
</body></html>
