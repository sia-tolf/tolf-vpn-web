<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>TOLF VPN</title>

  <style>
    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .panel {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      margin-bottom: 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 420px;
      color: #6e6e73;
      font-size: 18px;
      line-height: 1.5;
    }

    .action {
      display: block;
      width: 100%;
      margin-top: 36px;
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;
      background: #1d1d1f;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .action:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .status {
      min-height: 22px;
      margin-top: 16px;
      color: #86868b;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000000;
        color: #f5f5f7;
      }

      .subtitle,
      .status {
        color: #98989d;
      }

      .action {
        background: #f5f5f7;
        color: #1d1d1f;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <div class="brand">TOLF VPN</div>

      <h1>System VPN access for your devices.</h1>

      <p class="subtitle">
        Create your TOLF VPN account using a Passkey.
      </p>

      <button id="create-account" class="action" type="button">
        Create account with Passkey
      </button>

      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const API = "https://api.tolf.is";

    const button = document.getElementById("create-account");
    const status = document.getElementById("status");

    function base64urlToBytes(value) {
      const padding = "=".repeat((4 - value.length % 4) % 4);
      const base64 = (value + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function bytesToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }

    function prepareCreationOptions(options) {
      options.challenge = base64urlToBytes(options.challenge);
      options.user.id = base64urlToBytes(options.user.id);

      if (options.excludeCredentials) {
        options.excludeCredentials = options.excludeCredentials.map(
          credential => ({
            ...credential,
            id: base64urlToBytes(credential.id)
          })
        );
      }

      return options;
    }

    function credentialToJSON(credential) {
      const response = {
        clientDataJSON: bytesToBase64url(
          credential.response.clientDataJSON
        ),
        attestationObject: bytesToBase64url(
          credential.response.attestationObject
        )
      };

      if (typeof credential.response.getTransports === "function") {
        response.transports = credential.response.getTransports();
      }

      return {
        id: credential.id,
        rawId: bytesToBase64url(credential.rawId),
        type: credential.type,
        authenticatorAttachment:
          credential.authenticatorAttachment ?? null,
        response,
        clientExtensionResults:
          credential.getClientExtensionResults()
      };
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Preparing Passkey…";

      try {
        if (!window.PublicKeyCredential) {
          throw new Error("Passkeys are not supported on this device.");
        }

        const beginResponse = await fetch(
          `${API}/passkey/register/begin`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        if (!beginResponse.ok) {
          throw new Error("Unable to start account creation.");
        }

        const begin = await beginResponse.json();

        const publicKey = prepareCreationOptions(begin.options);

        status.textContent = "Waiting for Passkey…";

        const credential = await navigator.credentials.create({
          publicKey
        });

        if (!credential) {
          throw new Error("Passkey creation was cancelled.");
        }

        status.textContent = "Verifying Passkey…";

        const finishResponse = await fetch(
          `${API}/passkey/register/finish`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              challengeId: begin.challengeId,
              credential: credentialToJSON(credential)
            })
          }
        );

        if (!finishResponse.ok) {
          const error = await finishResponse.json().catch(() => null);
          throw new Error(
            error?.detail || "Passkey verification failed."
          );
        }

        status.textContent = "Account created successfully.";
        button.textContent = "Passkey created";
      } catch (error) {
        console.error(error);
        status.textContent =
          error?.message || "Account creation failed.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
