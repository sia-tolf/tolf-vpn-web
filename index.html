<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>TOLF VPN</title>

  <style>
    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .panel {
      width: 100%;
      max-width: 560px;
    }

    .center {
      text-align: center;
    }

    .brand {
      margin-bottom: 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 440px;
      color: #6e6e73;
      font-size: 18px;
      line-height: 1.5;
    }

    .action {
      display: block;
      width: 100%;
      margin-top: 36px;
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;
      background: #1d1d1f;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary {
      margin-top: 12px;
      background: transparent;
      color: #1d1d1f;
      border: 1px solid #c7c7cc;
    }

    .action:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .status {
      min-height: 22px;
      margin-top: 18px;
      color: #86868b;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .dashboard {
      display: none;
    }

    .dashboard-header {
      margin-bottom: 24px;
    }

    .dashboard-header h1 {
      font-size: 34px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #d8d8dc;
      border-radius: 20px;
      overflow: hidden;
    }

    .card-header {
      padding: 24px 26px;
    }

    .card-title {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      margin: 8px 0 0;
      color: #6e6e73;
      font-size: 15px;
      line-height: 1.45;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 26px;
      border-top: 1px solid #e5e5e7;
      font-size: 15px;
      line-height: 1.4;
    }

    .label {
      color: #6e6e73;
    }

    .value {
      text-align: right;
      font-weight: 500;
    }

    @media (max-width: 520px) {
      h1 {
        font-size: 36px;
      }

      .dashboard-header h1 {
        font-size: 30px;
      }

      .row {
        padding-left: 20px;
        padding-right: 20px;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000000;
        color: #f5f5f7;
      }

      .subtitle,
      .status,
      .card-subtitle,
      .label {
        color: #98989d;
      }

      .action {
        background: #f5f5f7;
        color: #1d1d1f;
      }

      .secondary {
        background: transparent;
        color: #f5f5f7;
        border-color: #48484a;
      }

      .card {
        background: #1c1c1e;
        border-color: #38383a;
      }

      .row {
        border-color: #38383a;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <div id="login-view" class="center">
        <div class="brand">TOLF VPN</div>

        <h1>System VPN access for your devices.</h1>

        <p class="subtitle">
          Sign in to manage your VPN access and devices.
        </p>

        <button id="sign-in" class="action" type="button">
          Sign in with Passkey
        </button>

        <button id="create-account" class="action secondary" type="button">
          Create account
        </button>

        <div id="status" class="status"></div>
      </div>

      <div id="dashboard" class="dashboard">
        <div class="brand">TOLF VPN</div>

        <div class="dashboard-header">
          <h1>My VPN</h1>
          <p class="subtitle">
            Manage your TOLF VPN access and devices.
          </p>
        </div>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">VPN Access</h2>
            <p class="card-subtitle">
              Your account is ready. VPN access has not been configured yet.
            </p>
          </div>

          <div class="row">
            <div class="label">Status</div>
            <div class="value">Not configured</div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const API = "https://api.tolf.is";

    const loginView = document.getElementById("login-view");
    const dashboard = document.getElementById("dashboard");
    const signInButton = document.getElementById("sign-in");
    const createButton = document.getElementById("create-account");
    const status = document.getElementById("status");

    function showDashboard() {
      loginView.style.display = "none";
      dashboard.style.display = "block";
    }

    function base64urlToBytes(value) {
      const padding = "=".repeat((4 - value.length % 4) % 4);

      const base64 = (value + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes;
    }

    function bytesToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }

    function prepareCreationOptions(options) {
      options.challenge = base64urlToBytes(options.challenge);
      options.user.id = base64urlToBytes(options.user.id);

      if (options.excludeCredentials) {
        options.excludeCredentials = options.excludeCredentials.map(
          credential => ({
            ...credential,
            id: base64urlToBytes(credential.id)
          })
        );
      }

      return options;
    }

    function prepareRequestOptions(options) {
      options.challenge = base64urlToBytes(options.challenge);

      if (options.allowCredentials) {
        options.allowCredentials = options.allowCredentials.map(
          credential => ({
            ...credential,
            id: base64urlToBytes(credential.id)
          })
        );
      }

      return options;
    }

    function registrationCredentialToJSON(credential) {
      const response = {
        clientDataJSON: bytesToBase64url(
          credential.response.clientDataJSON
        ),
        attestationObject: bytesToBase64url(
          credential.response.attestationObject
        )
      };

      if (typeof credential.response.getTransports === "function") {
        response.transports = credential.response.getTransports();
      }

      return {
        id: credential.id,
        rawId: bytesToBase64url(credential.rawId),
        type: credential.type,
        authenticatorAttachment:
          credential.authenticatorAttachment ?? null,
        response,
        clientExtensionResults:
          credential.getClientExtensionResults()
      };
    }

    function authenticationCredentialToJSON(credential) {
      return {
        id: credential.id,
        rawId: bytesToBase64url(credential.rawId),
        type: credential.type,
        authenticatorAttachment:
          credential.authenticatorAttachment ?? null,
        response: {
          clientDataJSON: bytesToBase64url(
            credential.response.clientDataJSON
          ),
          authenticatorData: bytesToBase64url(
            credential.response.authenticatorData
          ),
          signature: bytesToBase64url(
            credential.response.signature
          ),
          userHandle: credential.response.userHandle
            ? bytesToBase64url(credential.response.userHandle)
            : null
        },
        clientExtensionResults:
          credential.getClientExtensionResults()
      };
    }

    function setBusy(busy) {
      signInButton.disabled = busy;
      createButton.disabled = busy;
    }

    async function checkSession() {
      try {
        const response = await fetch(
          `${API}/me`,
          {
            method: "GET",
            credentials: "include"
          }
        );

        if (response.ok) {
          showDashboard();
        }
      } catch (error) {
        console.error(error);
      }
    }

    signInButton.addEventListener("click", async () => {
      setBusy(true);
      status.textContent = "Preparing Passkey sign in…";

      try {
        const beginResponse = await fetch(
          `${API}/passkey/login/begin`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        if (!beginResponse.ok) {
          throw new Error("Unable to start sign in.");
        }

        const begin = await beginResponse.json();

        const credential = await navigator.credentials.get({
          publicKey: prepareRequestOptions(begin.options)
        });

        const finishResponse = await fetch(
          `${API}/passkey/login/finish`,
          {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              challengeId: begin.challengeId,
              credential:
                authenticationCredentialToJSON(credential)
            })
          }
        );

        if (!finishResponse.ok) {
          throw new Error("Passkey sign in failed.");
        }

        showDashboard();
      } catch (error) {
        console.error(error);
        status.textContent =
          error?.message || "Sign in failed.";
      } finally {
        setBusy(false);
      }
    });

    createButton.addEventListener("click", async () => {
      setBusy(true);
      status.textContent = "Preparing Passkey…";

      try {
        const beginResponse = await fetch(
          `${API}/passkey/register/begin`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

        if (!beginResponse.ok) {
          throw new Error("Unable to start account creation.");
        }

        const begin = await beginResponse.json();

        const credential = await navigator.credentials.create({
          publicKey: prepareCreationOptions(begin.options)
        });

        const finishResponse = await fetch(
          `${API}/passkey/register/finish`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              challengeId: begin.challengeId,
              credential:
                registrationCredentialToJSON(credential)
            })
          }
        );

        if (!finishResponse.ok) {
          throw new Error("Passkey verification failed.");
        }

        status.textContent =
          "Account created. Sign in with your Passkey.";
      } catch (error) {
        console.error(error);
        status.textContent =
          error?.message || "Account creation failed.";
      } finally {
        setBusy(false);
      }
    });

    checkSession();
  </script>
</body>
</html>
