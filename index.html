<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <title>TOLF VPN</title>

  <style>
    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .panel {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      margin-bottom: 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 420px;
      color: #6e6e73;
      font-size: 18px;
      line-height: 1.5;
    }

    .action {
      display: block;
      width: 100%;
      margin-top: 36px;
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;
      background: #1d1d1f;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .note {
      margin-top: 16px;
      color: #86868b;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000000;
        color: #f5f5f7;
      }

      .subtitle,
      .note {
        color: #98989d;
      }

      .action {
        background: #f5f5f7;
        color: #1d1d1f;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="panel">
      <div class="brand">TOLF VPN</div>

      <h1>System VPN access for your devices.</h1>

      <p class="subtitle">
        Sign in to manage your VPN access and install configuration profiles.
      </p>

      <button class="action" type="button">
        Sign in or create account
      </button>

      <p class="note">
        Account access will use Passkey.
      </p>
    </section>
  </main>
</body>
</html>
