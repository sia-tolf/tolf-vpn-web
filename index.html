<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="color-scheme" content="light dark">

  <title>TOLF VPN</title>

  <style>
    :root {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      color-scheme: light dark;

      --background: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --border: #d2d2d7;
      --button: #1d1d1f;
      --button-text: #ffffff;
      --success: #248a3d;
      --error: #d70015;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #000000;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #98989d;
        --border: #38383a;
        --button: #f5f5f7;
        --button-text: #1d1d1f;
        --success: #30d158;
        --error: #ff453a;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding:
        max(42px, env(safe-area-inset-top))
        24px
        max(42px, env(safe-area-inset-bottom));
    }

    .brand {
      margin-bottom: 36px;
    }

    .brand h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.12;
      letter-spacing: -0.025em;
      font-weight: 700;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--secondary);
      font-size: 17px;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .card-content {
      padding: 28px;
    }

    .card h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.015em;
      font-weight: 650;
    }

    .card-description {
      margin: 9px 0 0;
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 26px;
    }

    button,
    .button-link {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .primary {
      background: var(--button);
      color: var(--button-text);
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .status-table {
      margin-top: 24px;
      border-top: 1px solid var(--border);
    }

    .row {
      display: grid;
      grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1.4fr);
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }

    .row-label {
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.4;
    }

    .row-value {
      min-width: 0;
      text-align: right;
      font-size: 15px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .status-active {
      color: var(--success);
      font-weight: 600;
    }

    .message {
      margin-top: 18px;
      min-height: 22px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      color: var(--error);
    }

    .message.success {
      color: var(--success);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .brand h1 {
        font-size: 30px;
      }

      .card-content {
        padding: 22px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .row-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <h1>TOLF VPN</h1>
      <p>System VPN access for your devices.</p>
    </header>

    <section id="loadingCard" class="card">
      <div class="card-content">
        <h2>Loading</h2>
        <p class="card-description">
          Checking your account.
        </p>
      </div>
    </section>

    <section id="signedOutCard" class="card hidden">
      <div class="card-content">
        <h2>VPN access</h2>

        <p class="card-description">
          Sign in to manage your VPN access and devices.
        </p>

        <div class="actions">
          <button
            id="signInButton"
            class="primary"
            type="button"
          >
            Sign in with Passkey
          </button>

          <button
            id="createAccountButton"
            class="secondary"
            type="button"
          >
            Create account
          </button>
        </div>

        <div id="signedOutMessage" class="message"></div>
      </div>
    </section>

    <section id="vpnCard" class="card hidden">
      <div class="card-content">
        <h2>My VPN</h2>

        <p class="card-description">
          Manage your TOLF VPN access.
        </p>

        <div class="status-table">
          <div class="row">
            <div class="row-label">Status</div>
            <div
              id="vpnStatus"
              class="row-value"
            >
              —
            </div>
          </div>

          <div
            id="usernameRow"
            class="row hidden"
          >
            <div class="row-label">Username</div>
            <div
              id="vpnUsername"
              class="row-value"
            ></div>
          </div>
        </div>

        <div class="actions">
          <button
            id="createVpnButton"
            class="primary hidden"
            type="button"
          >
            Create VPN Access
          </button>

          <button
            id="generateProfileButton"
            class="primary hidden"
            type="button"
          >
            Generate Install Link
          </button>

          <a
            id="installProfileButton"
            class="button-link primary hidden"
            href="#"
            target="_blank"
            rel="noopener"
          >
            Install on Apple Device
          </a>
        </div>

        <div id="vpnMessage" class="message"></div>
      </div>
    </section>
  </main>

  <script>
    const API = "https://api.tolf.is";

    const loadingCard =
      document.getElementById("loadingCard");

    const signedOutCard =
      document.getElementById("signedOutCard");

    const vpnCard =
      document.getElementById("vpnCard");

    const signInButton =
      document.getElementById("signInButton");

    const createAccountButton =
      document.getElementById("createAccountButton");

    const signedOutMessage =
      document.getElementById("signedOutMessage");

    const vpnStatus =
      document.getElementById("vpnStatus");

    const usernameRow =
      document.getElementById("usernameRow");

    const vpnUsername =
      document.getElementById("vpnUsername");

    const createVpnButton =
      document.getElementById("createVpnButton");

    const generateProfileButton =
      document.getElementById("generateProfileButton");

    const installProfileButton =
      document.getElementById("installProfileButton");

    const vpnMessage =
      document.getElementById("vpnMessage");


    function base64urlToBuffer(value) {
      const padding =
        "=".repeat((4 - value.length % 4) % 4);

      const base64 =
        (value + padding)
          .replace(/-/g, "+")
          .replace(/_/g, "/");

      const binary = atob(base64);

      const bytes =
        new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return bytes.buffer;
    }


    function bufferToBase64url(buffer) {
      const bytes =
        new Uint8Array(buffer);

      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }


    function prepareRegistrationOptions(options) {
      const result = {
        ...options,
        challenge:
          base64urlToBuffer(options.challenge),
        user: {
          ...options.user,
          id:
            base64urlToBuffer(options.user.id)
        }
      };

      if (Array.isArray(options.excludeCredentials)) {
        result.excludeCredentials =
          options.excludeCredentials.map(
            credential => ({
              ...credential,
              id:
                base64urlToBuffer(
                  credential.id
                )
            })
          );
      }

      return result;
    }


    function prepareAuthenticationOptions(options) {
      const result = {
        ...options,
        challenge:
          base64urlToBuffer(options.challenge)
      };

      if (Array.isArray(options.allowCredentials)) {
        result.allowCredentials =
          options.allowCredentials.map(
            credential => ({
              ...credential,
              id:
                base64urlToBuffer(
                  credential.id
                )
            })
          );
      }

      return result;
    }


    function serializeCredential(credential) {
      const response = credential.response;

      const serialized = {
        id: credential.id,
        rawId:
          bufferToBase64url(credential.rawId),
        type: credential.type,
        authenticatorAttachment:
          credential.authenticatorAttachment || null,
        clientExtensionResults:
          credential.getClientExtensionResults()
      };

      if (
        typeof AuthenticatorAttestationResponse !==
          "undefined" &&
        response instanceof
          AuthenticatorAttestationResponse
      ) {
        serialized.response = {
          clientDataJSON:
            bufferToBase64url(
              response.clientDataJSON
            ),
          attestationObject:
            bufferToBase64url(
              response.attestationObject
            ),
          transports:
            typeof response.getTransports ===
              "function"
              ? response.getTransports()
              : []
        };

        return serialized;
      }

      serialized.response = {
        clientDataJSON:
          bufferToBase64url(
            response.clientDataJSON
          ),
        authenticatorData:
          bufferToBase64url(
            response.authenticatorData
          ),
        signature:
          bufferToBase64url(
            response.signature
          ),
        userHandle:
          response.userHandle
            ? bufferToBase64url(
                response.userHandle
              )
            : null
      };

      return serialized;
    }


    async function apiRequest(
      path,
      options = {}
    ) {
      const response =
        await fetch(
          API + path,
          {
            credentials: "include",
            ...options,
            headers: {
              "Content-Type":
                "application/json",
              ...(options.headers || {})
            }
          }
        );

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        const message =
          data?.detail ||
          "Request failed";

        throw new Error(message);
      }

      return data;
    }


    function showSignedOut() {
      loadingCard.classList.add("hidden");
      vpnCard.classList.add("hidden");
      signedOutCard.classList.remove("hidden");
    }


    function showVpn(vpn) {
      loadingCard.classList.add("hidden");
      signedOutCard.classList.add("hidden");
      vpnCard.classList.remove("hidden");

      installProfileButton.classList.add("hidden");
      installProfileButton.href = "#";

      vpnMessage.textContent = "";
      vpnMessage.className = "message";

      if (vpn.configured) {
        vpnStatus.textContent = "Active";
        vpnStatus.className =
          "row-value status-active";

        vpnUsername.textContent =
          vpn.username || "";

        usernameRow.classList.remove("hidden");

        createVpnButton.classList.add("hidden");

        generateProfileButton.classList.remove(
          "hidden"
        );
      } else {
        vpnStatus.textContent =
          "Not configured";

        vpnStatus.className = "row-value";

        vpnUsername.textContent = "";

        usernameRow.classList.add("hidden");

        generateProfileButton.classList.add(
          "hidden"
        );

        createVpnButton.classList.remove(
          "hidden"
        );
      }
    }


    async function loadAccount() {
      try {
        const data =
          await apiRequest("/me", {
            method: "GET"
          });

        showVpn(data.vpn);
      } catch {
        showSignedOut();
      }
    }


    signInButton.addEventListener(
      "click",
      async () => {
        signInButton.disabled = true;

        signedOutMessage.textContent =
          "Waiting for Passkey…";

        signedOutMessage.className =
          "message";

        try {
          const begin =
            await apiRequest(
              "/passkey/login/begin",
              {
                method: "POST",
                body: "{}"
              }
            );

          const credential =
            await navigator.credentials.get({
              publicKey:
                prepareAuthenticationOptions(
                  begin.options
                )
            });

          if (!credential) {
            throw new Error(
              "Passkey was not provided"
            );
          }

          await apiRequest(
            "/passkey/login/finish",
            {
              method: "POST",
              body: JSON.stringify({
                challengeId:
                  begin.challengeId,
                credential:
                  serializeCredential(
                    credential
                  )
              })
            }
          );

          signedOutMessage.textContent = "";

          await loadAccount();
        } catch (error) {
          signedOutMessage.textContent =
            error.message;

          signedOutMessage.className =
            "message error";
        } finally {
          signInButton.disabled = false;
        }
      }
    );


    createAccountButton.addEventListener(
      "click",
      async () => {
        createAccountButton.disabled = true;

        signedOutMessage.textContent =
          "Creating Passkey…";

        signedOutMessage.className =
          "message";

        try {
          const begin =
            await apiRequest(
              "/passkey/register/begin",
              {
                method: "POST",
                body: "{}"
              }
            );

          const credential =
            await navigator.credentials.create({
              publicKey:
                prepareRegistrationOptions(
                  begin.options
                )
            });

          if (!credential) {
            throw new Error(
              "Passkey was not created"
            );
          }

          await apiRequest(
            "/passkey/register/finish",
            {
              method: "POST",
              body: JSON.stringify({
                challengeId:
                  begin.challengeId,
                credential:
                  serializeCredential(
                    credential
                  )
              })
            }
          );

          signedOutMessage.textContent =
            "Account created. Sign in with your Passkey.";

          signedOutMessage.className =
            "message success";
        } catch (error) {
          signedOutMessage.textContent =
            error.message;

          signedOutMessage.className =
            "message error";
        } finally {
          createAccountButton.disabled = false;
        }
      }
    );


    createVpnButton.addEventListener(
      "click",
      async () => {
        createVpnButton.disabled = true;

        vpnMessage.textContent =
          "Creating VPN access…";

        vpnMessage.className =
          "message";

        try {
          const data =
            await apiRequest(
              "/vpn/create",
              {
                method: "POST",
                body: "{}"
              }
            );

          showVpn(data.vpn);

          if (data.profileUrl) {
            installProfileButton.href =
              data.profileUrl;

            installProfileButton.classList.remove(
              "hidden"
            );
          }

          vpnMessage.textContent =
            "VPN access created.";

          vpnMessage.className =
            "message success";
        } catch (error) {
          vpnMessage.textContent =
            error.message;

          vpnMessage.className =
            "message error";
        } finally {
          createVpnButton.disabled = false;
        }
      }
    );


    generateProfileButton.addEventListener(
      "click",
      async () => {
        generateProfileButton.disabled = true;

        installProfileButton.classList.add(
          "hidden"
        );

        installProfileButton.href = "#";

        vpnMessage.textContent =
          "Generating install link…";

        vpnMessage.className =
          "message";

        try {
          const data =
            await apiRequest(
              "/vpn/profile",
              {
                method: "POST",
                body: "{}"
              }
            );

          if (!data.profileUrl) {
            throw new Error(
              "Install link was not returned"
            );
          }

          installProfileButton.href =
            data.profileUrl;

          installProfileButton.classList.remove(
            "hidden"
          );

          vpnMessage.textContent =
            "Install link is ready.";

          vpnMessage.className =
            "message success";
        } catch (error) {
          vpnMessage.textContent =
            error.message;

          vpnMessage.className =
            "message error";
        } finally {
          generateProfileButton.disabled = false;
        }
      }
    );


    loadAccount();
  </script>
</body>
</html>
